name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate random passwords
        id: pw
        run: |
          STORE_PASS=$(openssl rand -base64 24 | tr -d '/+=')
          KEY_PASS=$(openssl rand -base64 24 | tr -d '/+=')
          echo "store_pass=$STORE_PASS" >> "$GITHUB_OUTPUT"
          echo "key_pass=$KEY_PASS" >> "$GITHUB_OUTPUT"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore release.keystore \
            -alias bike-recovery-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass '${{ steps.pw.outputs.store_pass }}' \
            -keypass '${{ steps.pw.outputs.key_pass }}' \
            -dname "CN=Dhanraj Bike, OU=Dev, O=Dhanraj Bike, L=Unknown, ST=Unknown, C=IN"

      - name: Base64-encode keystore
        run: base64 -w0 release.keystore > release.keystore.b64

      - name: Write credentials file
        run: |
          cat > SECRETS-README.txt <<EOF
          Paste these EXACT values into your GitHub repo's
          Settings > Secrets and variables > Actions, one secret each.

          ANDROID_KEYSTORE_BASE64:
          (use the full contents of release.keystore.b64 -- it's one long line, open that file and copy all of it)

          ANDROID_KEYSTORE_PASSWORD:
          ${{ steps.pw.outputs.store_pass }}

          ANDROID_KEY_ALIAS:
          bike-recovery-release

          ANDROID_KEY_PASSWORD:
          ${{ steps.pw.outputs.key_pass }}

          IMPORTANT: Download this artifact now and save release.keystore
          somewhere safe outside GitHub. You will need this exact file and
          these exact passwords for every future update to this app on the
          Play Store. If you lose them, you cannot update the app under the
          same listing ever again.

          After copying these values into your GitHub secrets, delete this
          workflow artifact (Actions tab > this run > trash icon) since it
          contains your signing credentials in plain text.
          EOF

      - name: Upload keystore and credentials
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-credentials
          path: |
            release.keystore
            release.keystore.b64
            SECRETS-README.txt
          retention-days: 1
